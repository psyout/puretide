server {
	listen 443 ssl;
	server_name puretide.ca www.puretide.ca;

	ssl_certificate /etc/letsencrypt/live/puretide.ca/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/puretide.ca/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		# Auth0 may split its encrypted session across several Set-Cookie headers.
		# The nginx defaults are too small for the callback response and cause 502s.
		proxy_buffer_size 32k;
		proxy_buffers 8 32k;
		proxy_busy_buffers_size 64k;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}
}

server {
	listen 80;
	server_name puretide.ca www.puretide.ca;
	return 301 https://$host$request_uri;
}
