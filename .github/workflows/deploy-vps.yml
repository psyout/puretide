name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      PM2_APP: ${{ secrets.PM2_APP }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: "Preflight: verify required secrets are present"
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in VPS_HOST VPS_USER VPS_PATH PM2_APP VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!var:-}" ]]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Ensure rsync is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DASHBOARD_SECRET: ci-placeholder-dashboard-secret
          ORDER_CONFIRMATION_SECRET: ci-placeholder-order-confirmation-secret

      - name: Sanity check standalone output
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .next/standalone ]]; then
            echo "Error: .next/standalone not found. next.config.js must have output: 'standalone'."
            exit 1
          fi
          ls -la .next/standalone | head -n 50

      - name: Write deploy key
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_PRIVATE_KEY_B64:-}" ]]; then
            echo "Missing required secret: VPS_SSH_PRIVATE_KEY_B64"
            exit 1
          fi

          mkdir -p ~/.ssh
          keyfile=~/.ssh/deploy_key
          printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 -d > "$keyfile"
          chmod 600 "$keyfile"
          if ! head -n 1 "$keyfile" | grep -q "OPENSSH PRIVATE KEY"; then
            echo "Decoded key does not look like an OpenSSH private key. Ensure VPS_SSH_PRIVATE_KEY_B64 is base64 of the PRIVATE key (not the .pub)."
            exit 1
          fi

      - name: Install pinned VPS host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: SSH smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          echo "Testing SSH connection to $SSH_TARGET on port $PORT..."
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -p "$PORT" "$SSH_TARGET" "echo ok"

      - name: Prepare VPS without stopping live app
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -p "$PORT" "$SSH_TARGET" "set -euo pipefail; test -d \"${VPS_PATH}\"; test -f \"${VPS_PATH}/.env\"; mkdir -p \"${VPS_PATH}/.deploy\" \"${VPS_PATH}/data\"; command -v npm; command -v pm2"

      - name: Sync complete build to VPS staging area
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -p ${PORT}"
          rsync -az --delete -e "$SSH" .next/ "${SSH_TARGET}:${VPS_PATH}/.deploy/next/"
          rsync -az --delete -e "$SSH" public/ "${SSH_TARGET}:${VPS_PATH}/.deploy/public/"
          rsync -az -e "$SSH" package.json package-lock.json "${SSH_TARGET}:${VPS_PATH}/.deploy/"

      - name: Activate build, restart PM2, and health-check
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -p "$PORT" "$SSH_TARGET" "set -euo pipefail; cd \"${VPS_PATH}\"; test -f .deploy/next/BUILD_ID; test -f .env; test -d data; rm -rf .deploy/previous-next .deploy/previous-public; if [ -d .next ]; then mv .next .deploy/previous-next; fi; if [ -d public ]; then mv public .deploy/previous-public; fi; mv .deploy/next .next; mv .deploy/public public; cp package.json .deploy/package.json; cp package-lock.json .deploy/package-lock.json; npm ci --omit=dev --no-audit --no-fund; set -a; . ./.env; set +a; HOSTNAME=0.0.0.0 ORDERS_DB_PATH=\"${VPS_PATH}/data/orders.sqlite\" pm2 restart \"${PM2_APP}\" --update-env; for i in \$(seq 1 30); do if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then pm2 save; pm2 describe \"${PM2_APP}\" | sed -n '1,120p'; exit 0; fi; sleep 2; done; pm2 logs \"${PM2_APP}\" --lines 80 --nostream || true; pm2 stop \"${PM2_APP}\" || true; rm -rf .next public; if [ -d .deploy/previous-next ]; then mv .deploy/previous-next .next; fi; if [ -d .deploy/previous-public ]; then mv .deploy/previous-public public; fi; HOSTNAME=0.0.0.0 ORDERS_DB_PATH=\"${VPS_PATH}/data/orders.sqlite\" pm2 restart \"${PM2_APP}\" --update-env; exit 1"
